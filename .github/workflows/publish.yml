name: Generate Archive and Create Release
on:
  workflow_call:
    inputs:
      release:
        description: Create Github release
        required: false
        type: boolean
        default: false
      upload_to_gd:
        description: Uploads the mod to Google Drive
        required: false
        type: boolean
        default: false
      notify_discord:
        description: Triggers a webhook to notify discord users
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive


      - name: Get version
        id: extract_version
        run: echo "::set-output name=version::$(jq -r '.version' _metadata)"

      - name: Get latest release version
        if: ${{inputs.release}}
        id: latest_release
        shell: bash
        env:
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch latest release from GitHub API
          LATEST_TAG=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/$REPO/releases/latest \
            | jq -r '.tag_name')

          echo "Latest release tag: $LATEST_TAG"

          # Strip leading 'v' if present so we can compare plain versions
          CLEAN_TAG=${LATEST_TAG#v}
          echo "clean_tag=$CLEAN_TAG" >> $GITHUB_OUTPUT

      - name: Fail if version is same as latest release
        if: ${{inputs.release}}
        shell: bash
        run: |
          META_VERSION="${{ steps.extract_version.outputs.version }}"
          LATEST_VERSION="${{ steps.latest_release.outputs.clean_tag }}"

          echo "Metadata version: $META_VERSION"
          echo "Latest release version: $LATEST_VERSION"

          if [ "$META_VERSION" = "$LATEST_VERSION" ]; then
            echo "Error: Version $META_VERSION is already the latest release. Bump the version in _metadata."
            exit 1
          fi

      - name: Run Asset Packer
        uses: KrashV/starbound-asset-packer-action@v1
        with:
          output: ${{ env.MOD_NAME }}.pak

      - name: 'Create GitHub Release'
        if: ${{inputs.release}}
        uses: softprops/action-gh-release@v1
        with:
          body_path: CHANGELOG.md
          files: ${{ env.MOD_NAME }}.pak
          tag_name: v${{ steps.extract_version.outputs.version }}
          name: Release V${{ steps.extract_version.outputs.version }}

      - name: Get changelog content
        id: read_file
        uses: andstor/file-reader-action@v1
        with:
          path: "CHANGELOG.md"

      - name: Upload mod to Google Drive
        if: ${{inputs.upload_to_gd}}
        uses: logickoder/google-drive-upload@main
        with:
          credentials: ${{ secrets.GCP_CREDENTIAL }}
          filename: ${{ env.MOD_NAME }}.pak
          folderId: ${{ secrets.DRIVE_FOLDER_ID }}
          overwrite: "true"

      - name: Discord Webhook Action
        if: ${{inputs.notify_discord}}
        uses: tsickert/discord-webhook@v6.0.0
        with:
          webhook-url: ${{ secrets.WEBHOOK_URL }}
          filename: ${{ env.MOD_NAME }}.pak
          content: "<@&${{ vars.ROLE_MENTION }}> ${{ env.MOD_NAME }} V${{ steps.extract_version.outputs.version }}\n${{ steps.read_file.outputs.contents }}"

        
